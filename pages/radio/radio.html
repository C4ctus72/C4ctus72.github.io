<main id="songlistbuttons">
    <div>
        <button onclick="document.getElementById('player').play()" id="play" class="radio_control">
            > Play <
        </button>
        <button onclick="document.getElementById('player').pause()" id="pause" class="radio_control">
            Pause
        </button>
        <button
                onclick="document.getElementById('player').volume += 0.1"
                id="volplus"
                class="radio_control"
        >
            Vol +
        </button>
        <button
                onclick="document.getElementById('player').volume -= 0.1"
                id="volminus"
                class="radio_control"
        >
            Vol -
        </button>
    </div>
    <p>
        Now playing -
        <a
                href="https://www.youtube.com/watch?v=iHEL3iHdu2A"
                id="playingsong"
        >Nightlight by Saruky</a
        >
    </p>
    <audio
            id="player"
            src="/pages/radio/songs/Nightlight (Menu Music) - FNF_ Hotline 024 (The Medley Update) [ ezmp3.cc ].mp3"
            loop
    ></audio>
</main>
